name: Exercise promotion policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-promotion-policy.yml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Check receipt expiry and candidate changes
        env:
          PYTHONPATH: tests
        run: |
          python -B -m unittest -v \
            test_trusted_promotion.TrustedPromotionTests.test_receipt_cannot_be_replayed_or_used_for_another_digest \
            test_trusted_promotion.TrustedPromotionTests.test_candidate_or_source_tip_changing_during_verification_is_rejected
