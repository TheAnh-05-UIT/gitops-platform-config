name: Trusted promotion verification

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  trusted-promotion:
    name: Verify promotion from protected Config base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: promotion-verification
    concurrency:
      group: trusted-promotion-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out only the protected Config base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Verify the exact GitHub merge candidate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONFIG_READ_TOKEN: ${{ github.token }}
          WORKLOAD_READ_TOKEN: ${{ secrets.PROMOTION_WORKLOAD_READ_TOKEN }}
          REGISTRY_READ_USER: ${{ vars.PROMOTION_REGISTRY_READ_USER }}
          REGISTRY_READ_TOKEN: ${{ secrets.PROMOTION_REGISTRY_READ_TOKEN }}
          PROMOTION_REVIEWER_IDS: ${{ vars.PROMOTION_REVIEWER_IDS }}
          PROMOTION_BOT_ID: ${{ vars.PROMOTION_BOT_ID }}
        shell: bash
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          if [[ -n "$REGISTRY_READ_USER" || -n "$REGISTRY_READ_TOKEN" ]]; then
            [[ -n "$REGISTRY_READ_USER" && -n "$REGISTRY_READ_TOKEN" ]]
            printf '%s' "$REGISTRY_READ_TOKEN" |
              docker login ghcr.io --username "$REGISTRY_READ_USER" --password-stdin
          fi
          unset REGISTRY_READ_TOKEN REGISTRY_READ_USER
          python -B -m scripts.check_promotion --trusted-pr --pr "$PR_NUMBER"
