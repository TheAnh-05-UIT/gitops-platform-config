name: Validate deployment config

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate workload manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out config repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out trusted config base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-policy
          persist-credentials: false
          sparse-checkout: scripts

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v4.3.2'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Lint Helm chart
        run: helm lint ./apps/workload-api

      - name: Render Kubernetes manifests
        run: helm template workload-api ./apps/workload-api > rendered.yaml

      - name: Check deployment policies
        run: python trusted-policy/scripts/check_deployment_policies.py rendered.yaml
