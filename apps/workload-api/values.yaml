image:
  repository: "ghcr.io/theanh-05-uit/gitops-platform-workload-api"
  tag: "97172600d3b87dded805e942d6e247190a0827e1"

replicaCount: 2

nodeSelector:
  idp.example.com/region: ap-southeast-1

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""

networkPolicy:
  enabled: false
  allowedIngress: []

namespaceBudget:
  enabled: false
  hard:
    pods: "8"
    requests.cpu: "1500m"
    requests.memory: "1Gi"
    limits.cpu: "3"
    limits.memory: "2Gi"
  containerMax:
    cpu: "1"
    memory: "512Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

disruptionBudget:
  enabled: false
  minAvailable: 1
  eligibleNodes: 1
