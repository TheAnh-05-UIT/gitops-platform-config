apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workload-lab
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/theanh-05-uit/gitops-platform-config.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: workloads
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
