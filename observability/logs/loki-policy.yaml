apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-loki-allow-clients
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: lab-loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-alloy
        - podSelector:
            matchLabels:
              idp.example.com/log-reader: workload-observability
      ports:
        - protocol: TCP
          port: 3100
