fullnameOverride: lab-loki
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: lab_loki_
          period: 24h
  storage:
    type: filesystem
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 48h
    ingestion_rate_mb: 1
    ingestion_burst_size_mb: 2
    max_global_streams_per_user: 100
singleBinary:
  replicas: 1
  sidecar: false
  podDisruptionBudget:
    enabled: false
  persistence:
    enabled: true
    storageClass: local-path
    size: 4Gi
    enableStatefulSetAutoDeletePVC: false
  resources:
    requests: {cpu: 80m, memory: 192Mi}
    limits: {cpu: 400m, memory: 512Mi}
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
gateway:
  enabled: false
ingress:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
