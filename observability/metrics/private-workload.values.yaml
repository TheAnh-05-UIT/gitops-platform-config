ingress:
  enabled: true
  className: traefik
  host: workload.lab.example.internal
  tlsSecretName: workload-api-lab-tls
networkPolicy:
  enabled: true
  allowedIngress:
    - namespace: kube-system
      podLabels:
        app.kubernetes.io/name: traefik
    - namespace: observability
      podLabels:
        idp.example.com/metrics-collector: workload-observability
namespaceBudget:
  enabled: true
